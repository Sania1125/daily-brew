<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Bliss</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Coffee Bliss</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#menu">Menu</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section id="hero">
    <h2>Start Your Day with a Cup of Bliss</h2>
    <p>Freshly brewed coffee just for you.</p>
  </section>

  <section id="menu">
    <h2>Our Menu</h2>
  
    <div class="menu-container">
      <div class="menu-item">
        <img src="images/cappuccino.jpg" alt="Cappuccino" width="200">
        <h3>Cappuccino</h3>
        <p>$4.00</p>
      </div>
  
      <div class="menu-item">
        <img src="images/latte.jpg" alt="Latte" width="200">
        <h3>Latte</h3>
        <p>$4.50</p>
      </div>
  
      <div class="menu-item">
        <img src="images/espresso.jpg" alt="Espresso" width="200">
        <h3>Espresso</h3>
        <p>$3.00</p>
      </div>
    </div>
  </section>
  

  <footer>
    <p>&copy; 2025 Daily Brew</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
