<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Brew | Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">Daily Brew</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="#">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
  </nav>

  <header class="hero-section">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. Reach out with questions, suggestions, or just to say hi!</p>
  </header>

  <main>
    <section class="contact-form-section">
      <h2>Send a Message</h2>
      <form onsubmit="return sendMessage()">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

    <section class="contact-details">
      <h2>Visit Us</h2>
      <p>📍 123 Brew Lane, Coffee City</p>
      <p>📞 +1 234 567 8900</p>
      <p>📧 hello@dailybrew.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Café Team</p>
  </footer>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      document.title = document.body.classList.contains("dark-mode")
        ? "Daily Brew | Contact (Dark Mode)"
        : "Daily Brew | Contact";
    }

    function sendMessage() {
      alert("✅ Thank you! Your message has been sent.");
      return false; // prevents real form submission
    }
  </script>
</body>
</html>
