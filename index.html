<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Brew | Home</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff;
      color: #333;
    }

    .hero-section {
      background-image: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1600&q=80'); /* Public image URL */
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 120px 20px;
    }

    nav.navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 30px;
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #d4a373;
    }

    .hero-section h1 {
      font-size: 3rem;
      margin-bottom: 0.5em;
    }

    .hero-section p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: auto;
    }

    .cta-button {
      display: inline-block;
      margin-top: 25px;
      background-color: #d4a373;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .cta-button:hover {
      background-color: #b27c4b;
    }

    main {
      padding: 50px 20px;
      max-width: 800px;
      margin: auto;
    }

    .booking-section {
      margin-top: 40px;
      background-color: #f5f5f5;
      padding: 30px;
      border-radius: 10px;
    }

    .booking-section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, button {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #d4a373;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #b27c4b;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #eee;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Daily Brew</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Menu</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <header class="hero-section">
    <h1>Freshly Brewed Moments</h1>
    <p>Your perfect cup, every day. Step into warmth, aroma, and comfort.</p>
    <a href="#" class="cta-button">Explore Our Menu</a>
  </header>

  <main>
    <h2>Home Page</h2>
    <p>This is the main landing page. Customize it as needed.</p>

    <section class="booking-section">
      <h2>Book a Table</h2>
      <form>
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="date" name="date" required />
        <input type="time" name="time" required />
        <input type="number" name="guests" placeholder="Number of Guests" required />
        <button type="submit">Book Now</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Café Team</p>
  </footer>
</body>
</html>
